[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "polymeval"
dynamic         = ["version"]
description     = "Evaluation of polymerase-amplified PacBio HiFi read sets - VCF benchmarking for HG002 truth sets"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors     = [{ name = "Bernhard Bein"}]
maintainers = [{ name = "Bernhard Bein"}]
keywords    = ["bioinformatics", "pacbio", "hifi", "assembly", "snakemake", "polymerase", "vcf", "benchmarking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]


dependencies = [
    "ruamel.yaml>=0.18"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
polymeval = "polymeval.cli:main"

[project.urls]
Homepage   = "https://github.com/casparbein/polymeval"
Repository = "https://github.com/casparbein/polymeval"
Issues     = "https://github.com/casparbein/polymeval/issues"

[tool.hatch.version]
path = "src/polymeval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polymeval"]

artifacts = [
    "src/polymeval/workflow/**/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/polymeval", "LICENSE", "README.md", "CHANGELOG.md"]